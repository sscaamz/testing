name: Strawberry FullLTO V4L2
on:
  push:
    branches: [strawberry-v4l2-exp1]
    paths: [.github/workflows/strawberry-v4l2.yml, strawberry-actions-kit.zip]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strawberry-v4l2-exp1
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'sscaamz/testing' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify reviewed kit and runner resources
        shell: bash
        run: |
          set -euo pipefail
          echo '500c17b9dd520ecdf422b4640f4f5ae5dd6dc4b0de1c7b69be78376e85ef4ced  strawberry-actions-kit.zip' | sha256sum --check
          unzip -q strawberry-actions-kit.zip -d .strawberry-kit
          mkdir -p .strawberry-kit/logs .strawberry-kit/dist
          free -h | tee .strawberry-kit/logs/memory.txt
          df -h | tee .strawberry-kit/logs/disk.txt
          test "$(awk '/MemTotal:/ {print $2}' /proc/meminfo)" -ge 14000000
      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 libelf-dev libssl-dev flex bison bc dwarves build-essential zstd cpio python3-zstandard libjemalloc2 kmod
      - name: Add free ephemeral swap for FullLTO
        shell: bash
        run: |
          set -euo pipefail
          test "$(df -B1 --output=avail / | tail -1)" -ge 42949672960
          sudo fallocate -l 24G /swap-strawberry
          sudo chmod 600 /swap-strawberry
          sudo mkswap /swap-strawberry
          sudo swapon /swap-strawberry
          free -h | tee -a .strawberry-kit/logs/memory.txt
          echo 'Standard free public runner; make -j4; LLD threads=1; 24 GiB extra ephemeral swap; no caches' | tee .strawberry-kit/logs/host-settings.txt
      - name: Recover private original firmware
        working-directory: .strawberry-kit
        env:
          STRAWBERRY_FW_01: ${{ secrets.STRAWBERRY_FW_01 }}
          STRAWBERRY_FW_02: ${{ secrets.STRAWBERRY_FW_02 }}
          STRAWBERRY_FW_03: ${{ secrets.STRAWBERRY_FW_03 }}
          STRAWBERRY_FW_04: ${{ secrets.STRAWBERRY_FW_04 }}
          STRAWBERRY_FW_05: ${{ secrets.STRAWBERRY_FW_05 }}
          STRAWBERRY_FW_06: ${{ secrets.STRAWBERRY_FW_06 }}
          STRAWBERRY_FW_07: ${{ secrets.STRAWBERRY_FW_07 }}
          STRAWBERRY_FW_08: ${{ secrets.STRAWBERRY_FW_08 }}
          STRAWBERRY_FW_09: ${{ secrets.STRAWBERRY_FW_09 }}
          STRAWBERRY_FW_10: ${{ secrets.STRAWBERRY_FW_10 }}
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          import os,base64,gzip,hashlib
          from pathlib import Path
          encoded=''.join(os.environ['STRAWBERRY_FW_'+str(i).zfill(2)] for i in range(1,11))
          data=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(data)==452764 and hashlib.sha256(data).hexdigest()=='c5b84ce8f70072f9f11173f448d574655ff2506595cb8dc113f6d8110272ad66'
          Path('work').mkdir(exist_ok=True)
          p=Path('work/private-sd8797.bin');p.write_bytes(data);p.chmod(0o600)
          print('Private original firmware reconstructed and SHA-256 verified')
          PY
      - name: Build and verify kernel and module
        working-directory: .strawberry-kit
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/build.sh')
          p.write_text('\n'.join(l for l in p.read_text().splitlines() if not l.startswith('curl --fail') and not l.startswith("echo '0721138983"))+'\n')
          Path('scripts/prepare.py').write_text("from pathlib import Path\nimport hashlib,json,subprocess,shutil\nmanifest=json.loads(Path('inputs/firmware-manifest.json').read_text())\nassert hashlib.sha256(Path('inputs/original.config').read_bytes()).hexdigest()=='a159bc5a3384d45e30da261c8806e7f631e011fdc5abf90a69d5b3f5fcc8a4f2'\nfor item in manifest:\n    name=item['name']\n    source=Path('work/private-sd8797.bin') if name=='mrvl/sd8797_uapsta.bin' else Path('work/linux/extra_firmware')/name\n    data=source.read_bytes()\n    assert len(data)==item['size'] and hashlib.sha256(data).hexdigest()==item['sha256'], 'Firmware hash mismatch: '+name\n    target=Path('work/original-firmware')/name\n    target.parent.mkdir(parents=True,exist_ok=True)\n    target.write_bytes(data)\ndestination='/home/runner/work/linux/linux/kernel-source-host/extra_firmware'\nsubprocess.run(['sudo','mkdir','-p',destination],check=True)\nsubprocess.run(['sudo','cp','-a','work/original-firmware/.',destination+'/'],check=True)\nPath('logs/firmware-input-verification.json').write_text(json.dumps(manifest,indent=2)+'\\n')\nprint('All 12 original firmware inputs verified by length and SHA-256')\n")
          p=Path('scripts/report.py')
          p.write_text(p.read_text().replace('The original firmware is recovered from the checksum-verified public original kernel.', 'Eleven firmware blobs match the pinned source; the recovered twelfth is supplied via encrypted Actions secrets.'))
          PY
          sed -i 's/-j2 bzImage modules/-j4 bzImage modules/' scripts/build.sh
          sed -i 's/make -j2/make -j4; 24 GiB additional ephemeral swap/' scripts/report.py
          bash scripts/build.sh 2>&1 | tee logs/build-console.log
      - name: Upload successful binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strawberry-v4l2-exp1
          path: .strawberry-kit/dist/strawberry-v4l2-exp1.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strawberry-build-failure-logs
          path: .strawberry-kit/logs/
          retention-days: 1
